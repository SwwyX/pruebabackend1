<!DOCTYPE html>
<!--
  Plantilla base del sitio.
  Carga Bootstrap desde CDN, define el menu de navegacion comun y las
  funciones JavaScript que usan todas las paginas para hablar con la API.
  Las demas plantillas la extienden y solo rellenan el bloque "contenido".
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Gestion Academica{% endblock %}</title>

  <!-- Bootstrap 5 por CDN (requerimiento: soporte Bootstrap CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Menu de navegacion: una seccion por cada tabla del modelo ER -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'courses' %}">Gestion Academica</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'teachers' %}">Docentes</a>
        <a class="nav-link" href="{% url 'courses' %}">Asignaturas</a>
        <a class="nav-link" href="{% url 'students' %}">Estudiantes</a>
        <a class="nav-link" href="{% url 'enrollments' %}">Inscripciones</a>
      </div>
    </div>
  </nav>

  <!-- Contenido propio de cada pagina -->
  <main class="container my-4">

    <!-- Zona donde se muestran los mensajes de error de la API -->
    <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

    {% block contenido %}{% endblock %}
  </main>

  <!-- Token CSRF: Django lo exige en las peticiones que modifican datos -->
  <div class="d-none">{% csrf_token %}</div>

  <script>
    // Token que Django genero en el formulario oculto de mas arriba.
    const CSRF_TOKEN = document.querySelector("[name=csrfmiddlewaretoken]").value;

    /**
     * Funcion generica para consumir la API de forma asincrona.
     * Se usa en todas las paginas para las cuatro operaciones del CRUD.
     */
    async function api(url, metodo = "GET", datos = null) {
      const opciones = {
        method: metodo,
        headers: { "X-CSRFToken": CSRF_TOKEN },
      };

      // Las operaciones que envian datos (POST y PUT) mandan el cuerpo en JSON.
      if (datos !== null) {
        opciones.headers["Content-Type"] = "application/json";
        opciones.body = JSON.stringify(datos);
      }

      const respuesta = await fetch(url, opciones);

      // El DELETE responde 204 (sin contenido), asi que no hay JSON que leer.
      if (respuesta.status === 204) {
        return null;
      }

      const cuerpo = await respuesta.json();

      if (!respuesta.ok) {
        // La API devuelve los errores de validacion como {campo: [mensajes]}.
        const detalle = Object.values(cuerpo).flat().join(" ");
        throw new Error(detalle || "El servidor respondio " + respuesta.status);
      }

      return cuerpo;
    }

    /** Muestra un mensaje de error en la franja roja superior. */
    function mostrarError(texto) {
      const caja = document.getElementById("mensaje-error");
      caja.textContent = texto;
      caja.classList.remove("d-none");
    }

    /** Oculta el mensaje de error. */
    function limpiarError() {
      document.getElementById("mensaje-error").classList.add("d-none");
    }
  </script>

  <!-- Bloque para el JavaScript propio de cada pagina -->
  {% block scripts %}{% endblock %}

</body>
</html>
