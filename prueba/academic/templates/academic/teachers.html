{% extends 'academic/base.html' %}
{# CRUD de docentes: consume /api/teachers/ con fetch() #}

{% block titulo %}Docentes{% endblock %}

{% block contenido %}
  <h1 class="h3 mb-3">Docentes</h1>

  <!-- Formulario: sirve para crear y para editar -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h6 text-muted mb-3" id="titulo-formulario">Nuevo docente</h2>

      <form id="formulario" class="row g-2 align-items-end">
        <!-- Guarda el id cuando se esta editando; vacio al crear -->
        <input type="hidden" id="registro-id">

        <div class="col-md-4">
          <label class="form-label" for="first_name">Nombre</label>
          <input class="form-control" id="first_name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="last_name">Apellido</label>
          <input class="form-control" id="last_name" required>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary" type="submit">Guardar</button>
          <button class="btn btn-secondary d-none" type="button" id="btn-cancelar">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-docentes">
          <tr><td colspan="4" class="text-center">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const URL_API = "/api/teachers/";

  // READ: pide la lista a la API y dibuja la tabla.
  async function cargarDocentes() {
    const cuerpoTabla = document.getElementById("tabla-docentes");

    try {
      const docentes = await api(URL_API);

      cuerpoTabla.innerHTML = "";
      docentes.forEach(function (docente) {
        const fila = document.createElement("tr");
        fila.innerHTML =
          "<td>" + docente.id + "</td>" +
          "<td>" + docente.first_name + "</td>" +
          "<td>" + docente.last_name + "</td>" +
          '<td class="text-end">' +
            '<button class="btn btn-sm btn-outline-primary" data-editar="' + docente.id + '">Editar</button> ' +
            '<button class="btn btn-sm btn-outline-danger" data-eliminar="' + docente.id + '">Eliminar</button>' +
          "</td>";
        cuerpoTabla.appendChild(fila);
      });
    } catch (error) {
      cuerpoTabla.innerHTML =
        '<tr><td colspan="4" class="text-center text-danger">' +
        'No se pudieron cargar los docentes. (' + error.message + ')</td></tr>';
    }
  }

  // CREATE y UPDATE: si hay id en el formulario es edicion (PUT), si no es alta (POST).
  document.getElementById("formulario").addEventListener("submit", async function (evento) {
    evento.preventDefault();
    limpiarError();

    const id = document.getElementById("registro-id").value;
    const datos = {
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
    };

    try {
      if (id === "") {
        await api(URL_API, "POST", datos);
      } else {
        await api(URL_API + id + "/", "PUT", datos);
      }
      limpiarFormulario();
      cargarDocentes();
    } catch (error) {
      mostrarError(error.message);
    }
  });

  // Botones de cada fila: se escucha en la tabla completa (delegacion de eventos).
  document.getElementById("tabla-docentes").addEventListener("click", async function (evento) {
    const idEditar = evento.target.dataset.editar;
    const idEliminar = evento.target.dataset.eliminar;

    if (idEditar) {
      // Se traen los datos del registro y se cargan en el formulario.
      const docente = await api(URL_API + idEditar + "/");
      document.getElementById("registro-id").value = docente.id;
      document.getElementById("first_name").value = docente.first_name;
      document.getElementById("last_name").value = docente.last_name;
      document.getElementById("titulo-formulario").textContent = "Editando docente #" + docente.id;
      document.getElementById("btn-cancelar").classList.remove("d-none");
    }

    // DELETE: se pide confirmacion porque borra tambien sus asignaturas.
    if (idEliminar) {
      const confirmado = confirm(
        "Al eliminar el docente se eliminan sus asignaturas y las inscripciones de esas asignaturas. Continuar?");
      if (!confirmado) {
        return;
      }
      try {
        await api(URL_API + idEliminar + "/", "DELETE");
        cargarDocentes();
      } catch (error) {
        mostrarError(error.message);
      }
    }
  });

  document.getElementById("btn-cancelar").addEventListener("click", limpiarFormulario);

  /** Deja el formulario en modo "crear". */
  function limpiarFormulario() {
    document.getElementById("formulario").reset();
    document.getElementById("registro-id").value = "";
    document.getElementById("titulo-formulario").textContent = "Nuevo docente";
    document.getElementById("btn-cancelar").classList.add("d-none");
    limpiarError();
  }

  cargarDocentes();
</script>
{% endblock %}
